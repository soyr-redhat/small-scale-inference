[project]
name = "small-scale-inference"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["layers*", "architectures*", "weights*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
